AWSTemplateFormatVersion: '2010-09-09'
Description: 'Contact Form API - Lambda + API Gateway for handling form submissions'

Parameters:
  SESFromEmail:
    Type: String
    Default: contact@gregorywilsonjr.com
    Description: Verified SES email address for sending emails

  SESToEmail:
    Type: String
    Default: contact@gregorywilsonjr.com
    Description: Address that receives form submissions

  AllowedOrigin:
    Type: String
    Default: 'https://gregorywilsonjr.com'
    Description: 'Site origin permitted to call this API (scheme + host, no trailing slash)'
    AllowedPattern: '^https://[a-z0-9.-]+$'
    ConstraintDescription: 'Must be an https origin such as https://example.com'

  SiteName:
    Type: String
    Default: gregorywilsonjr.com
    Description: Site name shown in the notification email footer

  ThrottleRateLimit:
    Type: Number
    Default: 2
    MinValue: 1
    Description: Steady-state requests per second allowed against the API

  ThrottleBurstLimit:
    Type: Number
    Default: 5
    MinValue: 1
    Description: Burst request capacity allowed against the API

Resources:
  # IAM Role for Lambda
  ContactFormLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GWJContactFormLambdaRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SESSendEmailPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Scoped to the single verified identity, and further constrained
              # so a compromised function cannot spoof another From address
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${SESFromEmail}'
                Condition:
                  StringEquals:
                    'ses:FromAddress': !Ref SESFromEmail

  # Lambda Function
  ContactFormFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: gwj-contact-form-handler
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt ContactFormLambdaRole.Arn
      Timeout: 30
      # Caps the blast radius of a flood of submissions
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          SES_FROM_EMAIL: !Ref SESFromEmail
          SES_TO_EMAIL: !Ref SESToEmail
          ALLOWED_ORIGIN: !Ref AllowedOrigin
          SITE_NAME: !Ref SiteName
      Code:
        ZipFile: |
          // Placeholder - will be updated via deployment script
          exports.handler = async (event) => {
            return {
              statusCode: 200,
              body: JSON.stringify({ message: 'Function not yet deployed' })
            };
          };

  # API Gateway REST API
  ContactFormApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: gwj-contact-form-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
        MaxAge: 300

  # API Gateway Integration
  ContactFormIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ContactFormApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ContactFormFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  # API Gateway Route
  ContactFormRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ContactFormApi
      RouteKey: 'POST /contact'
      Target: !Sub 'integrations/${ContactFormIntegration}'

  # API Gateway Stage
  ContactFormStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ContactFormApi
      StageName: prod
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ThrottleRateLimit
        ThrottlingBurstLimit: !Ref ThrottleBurstLimit

  # Lambda Permission for API Gateway
  ApiGatewayInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ContactFormFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ContactFormApi}/*/POST/contact'

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${ContactFormApi}.execute-api.${AWS::Region}.amazonaws.com/prod/contact'
    Export:
      Name: ContactFormApiEndpoint

  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ContactFormFunction.Arn
    Export:
      Name: ContactFormLambdaArn
